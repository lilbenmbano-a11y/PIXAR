<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account // Pixar Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-scanline"></div>
<div class="bg-vignette"></div>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="mark"></span> Pixar Labs
    </a>
    <div class="nav-actions">
      <a class="btn btn-sm" href="login.html">Sign In</a>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <div class="logo" style="justify-content:center;margin-bottom:8px;">
        <span class="mark"></span> Pixar Labs
      </div>
      <p style="color:var(--text-dim);font-size:12px;text-align:center;">Create your Pixar Labs account</p>
    </div>
    <div class="auth-body">
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-row">
          <label for="signupName">Full Name</label>
          <input id="signupName" type="text" placeholder="e.g. Alex Chen" required maxlength="100" autofocus>
        </div>
        <div class="form-row">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" placeholder="Min 8 characters" required minlength="8">
        </div>
        <div class="error-msg" id="signupError"></div>
        <div class="form-actions" style="justify-content:stretch;">
          <button type="submit" class="btn btn-primary btn-block">[ Create Account ]</button>
        </div>
      </form>
      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/app.js"></script>
<script>
async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const errorEl = document.getElementById("signupError");

  try {
    const data = await api("/auth/register", { method: "POST", body: { name, email, password } });
    pushToast("Account Created", `Welcome to Pixar Labs, ${data.user.name}.`, "success");
    window.location.href = "dashboard.html";
  } catch (err) {
    const msg = {
      "EMAIL_ALREADY_EXISTS": "An account with this email already exists.",
      "INVALID_EMAIL": "Please enter a valid email address.",
      "PASSWORD_TOO_SHORT": "Password must be at least 8 characters.",
      "NAME_REQUIRED": "Please enter your name.",
    }[err.code] || (err.message || "Registration failed.");
    errorEl.textContent = msg;
    errorEl.classList.add("visible");
  }
}

// Redirect if already logged in
checkAuthState().then(authed => {
  if (authed) window.location.href = "dashboard.html";
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login // Pixar Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-scanline"></div>
<div class="bg-vignette"></div>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="mark"></span> Pixar Labs
    </a>
    <div class="nav-actions">
      <a class="btn btn-sm" href="signup.html">Create Account</a>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <div class="logo" style="justify-content:center;margin-bottom:8px;">
        <span class="mark"></span> Pixar Labs
      </div>
      <p style="color:var(--text-dim);font-size:12px;text-align:center;">Sign in to your account</p>
    </div>
    <div class="auth-body">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-row">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" required autofocus>
        </div>
        <div class="form-row">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••" required minlength="8">
        </div>
        <div class="error-msg" id="loginError"></div>
        <div class="form-actions" style="justify-content:stretch;">
          <button type="submit" class="btn btn-primary btn-block">[ Login ]</button>
        </div>
      </form>
      <div class="auth-switch">
        No account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/app.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");

  try {
    const data = await api("/auth/login", { method: "POST", body: { email, password } });
    pushToast("Login Successful", `Welcome back, ${data.user.name}.`, "success");
    window.location.href = "dashboard.html";
  } catch (err) {
    errorEl.textContent = err.code === "INVALID_CREDENTIALS"
      ? "Invalid email or password."
      : (err.message || "Login failed.");
    errorEl.classList.add("visible");
  }
}

// Redirect if already logged in
checkAuthState().then(authed => {
  if (authed) window.location.href = "dashboard.html";
});
</script>
</body>
</html>
